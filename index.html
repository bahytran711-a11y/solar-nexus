<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solar Flare OS v3.1 - Tối Ưu Mobile Hoàn Hảo</title>
    <style>
        :root {
            --bg-deep: #090406;
            --glass: rgba(24, 12, 16, 0.88);
            --glass-hover: rgba(42, 18, 22, 0.95);
            --border: rgba(255, 107, 53, 0.35);
            --fire-orange: #ff6b35;
            --fire-red: #ff2a5f;
            --fire-gold: #ffb703;
            --text-main: #fff8f6;
            --text-sub: #d4a59a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-deep); color: var(--text-main); height: 100vh; overflow: hidden; user-select: none; -webkit-user-select: none; }

        .ambient-glow {
            position: fixed; top: -20%; left: 30%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255, 42, 95, 0.14) 0%, rgba(255, 107, 53, 0.06) 45%, transparent 70%);
            pointer-events: none; z-index: 0; animation: pulseBg 8s infinite alternate;
        }
        @keyframes pulseBg { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.18); opacity: 1; } }

        #neuralCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: grab; touch-action: none; }
        #neuralCanvas:active { cursor: grabbing; }

        /* Nút mở lại sidebar gọn gàng */
        .sidebar-open-btn {
            position: fixed; top: 15px; left: 15px; width: 38px; height: 38px; border-radius: 10px;
            background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border); color: var(--fire-gold); display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; transition: 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); font-size: 1em;
            opacity: 0; pointer-events: none; transform: scale(0.8);
        }
        .sidebar.collapsed ~ .sidebar-open-btn {
            opacity: 1; pointer-events: auto; transform: scale(1);
        }
        .sidebar-open-btn:hover { background: var(--glass-hover); border-color: var(--fire-orange); color: #fff; transform: scale(1.08); }

        /* Khung Sidebar chính: Tối ưu kích thước linh hoạt trên mobile */
        .sidebar {
            position: fixed; top: 15px; left: 15px; width: 320px; max-width: calc(100vw - 30px); max-height: calc(100vh - 30px);
            background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border); border-radius: 16px; padding: 14px;
            display: flex; flex-direction: column; z-index: 50;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
        }
        .sidebar.collapsed { transform: translateX(-360px); opacity: 0; pointer-events: none; }

        .sidebar-header {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px;
        }

        .header-left-group { display: flex; align-items: center; gap: 8px; overflow: hidden; }

        .sidebar-toggle-btn {
            width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border);
            background: rgba(255, 107, 53, 0.12); color: var(--fire-gold);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 0.9em; flex-shrink: 0;
        }
        .sidebar-toggle-btn:hover { background: var(--fire-orange); color: #000; }

        .logo-text {
            font-size: 1em; font-weight: 800; letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--fire-gold), var(--fire-orange), var(--fire-red));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .btn-new-trigger {
            width: 28px; height: 28px; border-radius: 50%; border: none; flex-shrink: 0;
            background: linear-gradient(135deg, var(--fire-orange), var(--fire-red));
            color: #ffffff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.25s; padding: 0;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.45);
        }
        .btn-new-trigger:hover { transform: scale(1.1) rotate(90deg); }

        .search-box {
            width: 100%; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
            background: rgba(10, 4, 6, 0.8); color: #fff; font-size: 0.85em; margin-bottom: 10px;
        }
        .search-box:focus { outline: none; border-color: var(--fire-orange); }

        .node-list { flex: 1; overflow-y: auto; list-style: none; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; max-height: 45vh; }
        .node-item {
            padding: 8px 10px; border-radius: 9px; background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: space-between;
        }
        .node-item:hover { background: var(--glass-hover); border-color: rgba(255, 107, 53, 0.4); }
        .node-item.active {
            background: linear-gradient(90deg, rgba(255, 107, 53, 0.2), rgba(255, 42, 95, 0.1));
            border-color: var(--fire-orange); box-shadow: 0 0 15px rgba(255, 107, 53, 0.2);
        }
        .node-item-title { font-size: 0.85em; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Ngăn Drawer xem & tạo chi tiết gọn gàng trên mobile */
        .drawer {
            position: fixed; top: 15px; right: 15px; width: 380px; max-width: calc(100vw - 30px); max-height: calc(100vh - 30px);
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 16px; padding: 18px;
            z-index: 60; display: flex; flex-direction: column; overflow-y: auto;
            box-shadow: -10px 12px 40px rgba(0, 0, 0, 0.75);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
        }
        .drawer.hidden { transform: translateX(420px); opacity: 0; pointer-events: none; }

        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .badge { font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px; padding: 3px 8px; border-radius: 20px; background: rgba(255, 183, 3, 0.15); color: var(--fire-gold); font-weight: 700; }
        .close-btn { background: none; border: none; color: var(--text-sub); font-size: 1.2em; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
        .close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }

        #viewTitle { font-size: 1.2em; font-weight: 700; color: #fff; margin-bottom: 8px; line-height: 1.3; }
        #viewContent { font-size: 0.9em; color: #e2d1cd; line-height: 1.6; white-space: pre-line; user-select: text; min-height: 40px; }
        
        #viewImageBox { margin-top: 12px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: none; }
        #viewImage { width: 100%; height: auto; display: block; object-fit: cover; cursor: zoom-in; }

        .links-section { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); }
        .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .link-chip {
            padding: 4px 10px; border-radius: 20px; font-size: 0.78em; font-weight: 600;
            background: rgba(255, 107, 53, 0.15); border: 1px solid var(--fire-orange); color: var(--fire-gold);
            cursor: pointer; transition: 0.2s;
        }
        .link-chip:hover { background: var(--fire-orange); color: #000; }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.78em; color: var(--text-sub); margin-bottom: 4px; font-weight: 600; }
        input[type="text"], textarea, select {
            width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
            background: rgba(10, 4, 6, 0.8); color: #fff; font-size: 0.88em;
        }
        textarea { height: 80px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--fire-gold); }

        .img-dropzone {
            border: 1.5px dashed var(--fire-orange); border-radius: 9px; padding: 10px;
            text-align: center; font-size: 0.8em; color: var(--text-sub); cursor: pointer;
            background: rgba(255, 107, 53, 0.05); transition: 0.2s;
        }
        .img-dropzone:hover { background: rgba(255, 107, 53, 0.12); color: #fff; }
        #previewImg { max-width: 100%; max-height: 120px; border-radius: 6px; margin-top: 6px; display: none; }

        .btn-submit {
            width: 100%; padding: 10px; border: none; border-radius: 9px; font-weight: 700; font-size: 0.9em;
            background: linear-gradient(135deg, var(--fire-gold), var(--fire-orange), var(--fire-red));
            color: #090406; cursor: pointer; transition: 0.25s; margin-top: 4px;
        }
        .btn-submit:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(255, 107, 53, 0.5); }

        .btn-export, .btn-edit, .btn-delete {
            padding: 8px 10px; border-radius: 8px; font-size: 0.8em; font-weight: 600; cursor: pointer; width: 100%; margin-top: 6px;
        }
        .btn-export { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: #22d3ee; }
        .btn-edit { background: rgba(255, 183, 3, 0.15); border: 1px solid rgba(255, 183, 3, 0.4); color: var(--fire-gold); }
        .btn-delete { background: rgba(255, 42, 95, 0.15); border: 1px solid rgba(255, 42, 95, 0.4); color: #ff7597; }

        .hint-bar {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 7, 10, 0.8); backdrop-filter: blur(8px);
            border: 1px solid var(--border); padding: 5px 14px; border-radius: 20px;
            font-size: 0.75em; color: var(--text-sub); z-index: 5; pointer-events: none; text-align: center; max-width: 90%;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 107, 53, 0.3); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <canvas id="neuralCanvas"></canvas>

    <!-- Khung Sidebar chính -->
    <div class="sidebar" id="sidebarPanel">
        <div class="sidebar-header">
            <div class="header-left-group">
                <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Ẩn khung">☰</button>
                <span class="logo-text">🔥 SOLAR NEXUS</span>
            </div>
            <button class="btn-new-trigger" onclick="openCreateDrawer()" title="Tạo kiến thức mới">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Tìm kiếm kiến thức..." oninput="renderSidebar()">
        <ul class="node-list" id="nodeList"></ul>
    </div>

    <!-- Nút mở lại sidebar -->
    <button class="sidebar-open-btn" onclick="toggleSidebar()" title="Mở bảng điều khiển">☰</button>

    <!-- Ngăn xem chi tiết -->
    <div class="drawer hidden" id="viewDrawer">
        <div class="drawer-header">
            <span class="badge">✨ Chi tiết dữ liệu</span>
            <button class="close-btn" onclick="closeAllDrawers()">✕</button>
        </div>
        <h2 id="viewTitle">Tiêu đề</h2>
        <div id="viewContent">Nội dung...</div>
        
        <div id="viewImageBox">
            <img id="viewImage" src="" alt="Hình ảnh đính kèm" onclick="window.open(this.src)">
        </div>

        <div class="links-section">
            <div style="font-size: 0.75em; color: var(--text-sub); font-weight: 700;">MẠCH KẾT NỐI LIÊN QUAN:</div>
            <div class="tags-wrap" id="viewLinks"></div>
        </div>

        <button class="btn-export" onclick="exportCurrentNode()">📥 Xuất file mục này (.txt)</button>
        <button class="btn-edit" onclick="openEditCurrentNode()">✏️ Chỉnh sửa nội dung</button>
        <button class="btn-delete" onclick="deleteCurrentNode()">🗑️ Xóa mục này</button>
    </div>

    <!-- Ngăn tạo mới hoặc chỉnh sửa -->
    <div class="drawer hidden" id="createDrawer">
        <div class="drawer-header">
            <span class="badge" id="drawerTitleBadge">🚀 Tạo Hạt Nhân Mới</span>
            <button class="close-btn" onclick="closeAllDrawers()">✕</button>
        </div>
        
        <div class="form-group">
            <label>Tên chủ đề / Kiến thức</label>
            <input type="text" id="newTitle" placeholder="VD: Nguyên lý Turbocharger...">
        </div>

        <div class="form-group">
            <label>Liên kết với kiến thức khác</label>
            <select id="newParent"></select>
        </div>

        <div class="form-group">
            <label>Nội dung ghi chú</label>
            <textarea id="newContent" placeholder="Nhập thông tin cần lưu (Ctrl+V dán ảnh)..."></textarea>
        </div>

        <div class="form-group">
            <label>Hình ảnh minh họa (Tùy chọn)</label>
            <div class="img-dropzone" onclick="document.getElementById('fileInput').click()">
                📸 Nhấp chọn ảnh hoặc dán từ clipboard
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
                <img id="previewImg" src="">
            </div>
        </div>

        <button class="btn-submit" id="submitBtnText" onclick="saveNode()">🔥 Kích Hoạt & Lưu Trữ</button>
    </div>

    <div class="hint-bar">💡 Kéo để dịch chuyển • Dùng 2 ngón tay hoặc cuộn chuột để Zoom</div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'whoosh') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let brainData = JSON.parse(localStorage.getItem('solarNexusV3.1')) || [
            { id: 1, title: 'Lõi Năng Lượng Trung Tâm', content: 'Chào mừng bro đến với Solar Flare v3.1! Đã tối ưu giao diện mobile gọn gàng và hỗ trợ Zoom (Phóng to/Thu nhỏ) cực mượt.', image: '', links: [2, 3] },
            { id: 2, title: 'Cơ Khí & Động Lực Học', content: 'Nơi lưu trữ các nguyên lý truyền động, tỷ số truyền hộp số và biểu đồ công suất.', image: '', links: [1] },
            { id: 3, title: 'Tương Tác Đa Nền Tảng', content: 'Hoàn hảo trên cả PC lẫn Mobile.', image: '', links: [1] }
        ];

        let selectedId = null;
        let editingNodeId = null;
        let currentBase64Image = '';
        let nodesPos = {};
        let pulses = [];
        let typingInterval = null;

        let panX = 0;
        let panY = 0;
        let scale = 1; // Hệ số phóng to thu nhỏ (Zoom)
        
        let isPanning = false;
        let startPanX = 0;
        let startPanY = 0;
        let initialPinchDistance = null;

        function toggleSidebar() {
            playSound('click');
            const sidebar = document.getElementById('sidebarPanel');
            sidebar.classList.toggle('collapsed');
        }

        function initPhysics() {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            brainData.forEach((node, i) => {
                if (!nodesPos[node.id]) {
                    const angle = (i / Math.max(brainData.length, 1)) * Math.PI * 2;
                    const dist = 140 + Math.random() * 90;
                    nodesPos[node.id] = {
                        x: cx + Math.cos(angle) * dist,
                        y: cy + Math.sin(angle) * dist,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: node.links.length > 1 ? 10 : 7
                    };
                }
            });
        }

        function saveToStorage() {
            try {
                localStorage.setItem('solarNexusV3.1', JSON.stringify(brainData));
            } catch (e) {
                alert('Bộ nhớ trình duyệt đầy do ảnh quá lớn!');
            }
        }

        function renderSidebar() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('nodeList');
            list.innerHTML = '';

            brainData
                .filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q))
                .forEach(node => {
                    const li = document.createElement('li');
                    li.className = `node-item ${node.id === selectedId ? 'active' : ''}`;
                    li.innerHTML = `
                        <span class="node-item-title">${node.image ? '🖼️' : '🔥'} ${node.title}</span>
                        <span style="font-size:0.7em; color:var(--fire-gold)">${node.links.length} 🔗</span>
                    `;
                    li.onclick = () => { playSound('click'); openViewDrawer(node.id); };
                    list.appendChild(li);
                });
        }

        function typeWriterEffect(text) {
            const contentEl = document.getElementById('viewContent');
            contentEl.innerText = '';
            if (typingInterval) clearInterval(typingInterval);

            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    contentEl.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                }
            }, 10);
        }

        function openViewDrawer(id) {
            selectedId = id;
            const node = brainData.find(n => n.id === id);
            if (!node) return;

            playSound('whoosh');
            document.getElementById('createDrawer').classList.add('hidden');
            document.getElementById('viewDrawer').classList.remove('hidden');

            document.getElementById('viewTitle').innerText = node.title;
            typeWriterEffect(node.content || '(Không có mô tả văn bản)');

            const imgBox = document.getElementById('viewImageBox');
            const imgEl = document.getElementById('viewImage');
            if (node.image) {
                imgEl.src = node.image;
                imgBox.style.display = 'block';
            } else {
                imgBox.style.display = 'none';
            }

            const linksWrap = document.getElementById('viewLinks');
            linksWrap.innerHTML = '';
            const connected = brainData.filter(n => node.links.includes(n.id) || n.links.includes(node.id));
            
            if (connected.length === 0) {
                linksWrap.innerHTML = '<span style="font-size:0.8em; color:var(--text-sub)">Chưa nối với hạt nhân nào</span>';
            } else {
                connected.forEach(target => {
                    const chip = document.createElement('div');
                    chip.className = 'link-chip';
                    chip.innerText = '⚡ ' + target.title;
                    chip.onclick = () => { playSound('click'); openViewDrawer(target.id); };
                    linksWrap.appendChild(chip);
                });
            }

            renderSidebar();
        }

        function openCreateDrawer(editId = null) {
            playSound('click');
            selectedId = null;
            renderSidebar();
            document.getElementById('viewDrawer').classList.add('hidden');
            document.getElementById('createDrawer').classList.remove('hidden');

            const select = document.getElementById('newParent');
            select.innerHTML = '<option value="">-- Đứng độc lập --</option>';
            
            brainData.forEach(n => {
                if (editId && n.id === editId) return;
                const opt = document.createElement('option');
                opt.value = n.id;
                opt.innerText = n.title;
                select.appendChild(opt);
            });

            if (editId) {
                editingNodeId = editId;
                const node = brainData.find(n => n.id === editId);
                document.getElementById('drawerTitleBadge').innerText = '✏️ Chỉnh Sửa Hạt Nhân';
                document.getElementById('newTitle').value = node.title;
                document.getElementById('newContent').value = node.content || '';
                select.value = node.links.length > 0 ? node.links[0] : '';
                
                currentBase64Image = node.image || '';
                const preview = document.getElementById('previewImg');
                if (currentBase64Image) {
                    preview.src = currentBase64Image;
                    preview.style.display = 'block';
                } else {
                    preview.style.display = 'none';
                }
                document.getElementById('submitBtnText').innerText = '💾 Lưu Thay Đổi';
            } else {
                editingNodeId = null;
                document.getElementById('drawerTitleBadge').innerText = '🚀 Tạo Hạt Nhân Mới';
                document.getElementById('newTitle').value = '';
                document.getElementById('newContent').value = '';
                currentBase64Image = '';
                document.getElementById('previewImg').style.display = 'none';
                document.getElementById('submitBtnText').innerText = '🔥 Kích Hoạt & Lưu Trữ';
            }
        }

        function openEditCurrentNode() {
            if (selectedId) openCreateDrawer(selectedId);
        }

        function closeAllDrawers() {
            playSound('click');
            selectedId = null;
            editingNodeId = null;
            if (typingInterval) clearInterval(typingInterval);
            document.getElementById('viewDrawer').classList.add('hidden');
            document.getElementById('createDrawer').classList.add('hidden');
            renderSidebar();
        }

        function exportCurrentNode() {
            playSound('click');
            const node = brainData.find(n => n.id === selectedId);
            if (!node) return;

            const fileContent = `========================================\nCHỦ ĐỀ: ${node.title}\n========================================\n\nNỘI DUNG:\n${node.content || 'Không có nội dung'}\n\nLIÊN KẾT ID: ${node.links.join(', ') || 'Không có'}\n`;
            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${node.title.replace(/[^a-zA-Z0-9à-úÀ-Ú]/g, '_')}_SolarNexus.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function processImageFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 700;
                    let width = img.width;
                    let height = img.height;
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentBase64Image = canvas.toDataURL('image/jpeg', 0.7);

                    const preview = document.getElementById('previewImg');
                    preview.src = currentBase64Image;
                    preview.style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleImageUpload(event) {
            processImageFile(event.target.files[0]);
        }

        window.addEventListener('paste', (e) => {
            if (document.getElementById('createDrawer').classList.contains('hidden')) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    processImageFile(item.getAsFile());
                }
            }
        });

        function saveNode() {
            playSound('click');
            const title = document.getElementById('newTitle').value.trim();
            const content = document.getElementById('newContent').value.trim();
            const parentId = parseInt(document.getElementById('newParent').value);

            if (!title) return alert('Nhập tên chủ đề đã bro ơi!');

            requestAnimationFrame(() => {
                if (editingNodeId) {
                    const node = brainData.find(n => n.id === editingNodeId);
                    if (node) {
                        node.title = title;
                        node.content = content;
                        node.image = currentBase64Image;
                        if (parentId && !node.links.includes(parentId)) {
                            node.links.push(parentId);
                            const parent = brainData.find(n => n.id === parentId);
                            if (parent && !parent.links.includes(editingNodeId)) parent.links.push(editingNodeId);
                        }
                    }
                    saveToStorage();
                    openViewDrawer(editingNodeId);
                } else {
                    const newId = Date.now();
                    const newNode = {
                        id: newId,
                        title: title,
                        content: content,
                        image: currentBase64Image,
                        links: parentId ? [parentId] : []
                    };

                    brainData.push(newNode);
                    if (parentId) {
                        const parent = brainData.find(n => n.id === parentId);
                        if (parent && !parent.links.includes(newId)) parent.links.push(newId);
                    }

                    nodesPos[newId] = {
                        x: window.innerWidth / 2 - panX + (Math.random() * 80 - 40),
                        y: window.innerHeight / 2 - panY + (Math.random() * 80 - 40),
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: 9
                    };

                    saveToStorage();
                    openViewDrawer(newId);
                }
            });
        }

        function deleteCurrentNode() {
            playSound('click');
            if (!selectedId) return;
            if (!confirm('Bro chắc chắn muốn xóa đốm lửa kiến thức này chứ?')) return;

            brainData = brainData.filter(n => n.id !== selectedId);
            brainData.forEach(n => {
                n.links = n.links.filter(id => id !== selectedId);
            });
            delete nodesPos[selectedId];
            saveToStorage();
            closeAllDrawers();
        }

        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        let draggingNodeId = null;
        let isDraggingMoved = false;

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.onresize = resize;
        resize();
        initPhysics();

        setInterval(() => {
            if (brainData.length < 2) return;
            const n1 = brainData[Math.floor(Math.random() * brainData.length)];
            if (n1.links.length > 0) {
                const targetId = n1.links[Math.floor(Math.random() * n1.links.length)];
                pulses.push({ from: n1.id, to: targetId, progress: 0 });
            }
        }, 800);

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            if (draggingNodeId) {
                const draggedPos = nodesPos[draggingNodeId];
                brainData.forEach(target => {
                    if (target.id !== draggingNodeId) {
                        const tp = nodesPos[target.id];
                        if (tp && Math.hypot((draggedPos.x * scale + panX) - (tp.x * scale + panX), (draggedPos.y * scale + panY) - (tp.y * scale + panY)) < 60 * scale) {
                            const draggedNode = brainData.find(n => n.id === draggingNodeId);
                            if (draggedNode && !draggedNode.links.includes(target.id)) {
                                draggedNode.links.push(target.id);
                                target.links.push(draggingNodeId);
                                saveToStorage();
                                playSound('click');
                            }
                        }
                    }
                });
            }

            ctx.save();
            ctx.translate(panX, panY);
            ctx.scale(scale, scale);

            brainData.forEach(node => {
                const p1 = nodesPos[node.id];
                if (!p1) return;

                if (draggingNodeId !== node.id) {
                    p1.x += p1.vx;
                    p1.y += p1.vy;
                    if (p1.x < 50 || p1.x > window.innerWidth - 50) p1.vx *= -1;
                    if (p1.y < 50 || p1.y > window.innerHeight - 50) p1.vy *= -1;
                }

                node.links.forEach(targetId => {
                    const p2 = nodesPos[targetId];
                    if (p2) {
                        const isActive = (node.id === selectedId || targetId === selectedId);
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = isActive ? 'rgba(255, 183, 3, 0.85)' : 'rgba(255, 107, 53, 0.22)';
                        ctx.lineWidth = isActive ? 2.2 : 1.2;
                        ctx.stroke();
                    }
                });
            });

            for (let i = pulses.length - 1; i >= 0; i--) {
                const pulse = pulses[i];
                pulse.progress += 0.025;
                const p1 = nodesPos[pulse.from];
                const p2 = nodesPos[pulse.to];
                if (!p1 || !p2 || pulse.progress >= 1) {
                    pulses.splice(i, 1);
                    continue;
                }
                const px = p1.x + (p2.x - p1.x) * pulse.progress;
                const py = p1.y + (p2.y - p1.y) * pulse.progress;

                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fillStyle = '#ffb703';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff6b35';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            brainData.forEach(node => {
                const p = nodesPos[node.id];
                if (!p) return;

                const isSelected = (node.id === selectedId);
                const r = isSelected ? 12 : (p.radius || 8);

                const grad = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, isSelected ? 34 : 20);
                grad.addColorStop(0, isSelected ? 'rgba(255, 183, 3, 0.7)' : 'rgba(255, 107, 53, 0.35)');
                grad.addColorStop(1, 'transparent');
                ctx.beginPath();
                ctx.arc(p.x, p.y, isSelected ? 34 : 20, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fillStyle = isSelected ? '#ffb703' : '#ff2a5f';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = isSelected ? '#ffffff' : '#ff2a5f';
                ctx.stroke();

                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.shadowBlur = 4;
                ctx.fillStyle = isSelected ? '#ffffff' : '#ffe4dc';
                ctx.font = isSelected ? '700 14px "Segoe UI", system-ui, sans-serif' : '600 13px "Segoe UI", system-ui, sans-serif';
                ctx.fillText(node.title, p.x + r + 10, p.y + 4.5);
                ctx.shadowBlur = 0;
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        // --- XỬ LÝ ZOOM & PAN (HỖ TRỢ CHUỘT VÀ CẢM ỨNG 2 NGÓN TAY) ---

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomIntensity = 0.1;
            const prevScale = scale;
            if (e.deltaY < 0) {
                scale *= (1 + zoomIntensity);
            } else {
                scale /= (1 + zoomIntensity);
            }
            scale = Math.max(0.4, Math.min(scale, 3.5)); // Giới hạn mức zoom

            // Zoom hướng vào vị trí con trỏ chuột
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            panX = mouseX - (mouseX - panX) * (scale / prevScale);
            panY = mouseY - (mouseY - panY) * (scale / prevScale);
        }, { passive: false });

        // Xử lý chuột (Desktop)
        canvas.addEventListener('mousedown', (e) => { handleStart(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { handleMove(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { handleEnd(); });

        // Xử lý cảm ứng (Mobile: 1 ngón kéo bản đồ / node, 2 ngón pinch-to-zoom)
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                handleStart(touch.clientX, touch.clientY);
                initialPinchDistance = null;
            } else if (e.touches.length === 2) {
                isPanning = false;
                draggingNodeId = null;
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && (isPanning || draggingNodeId)) {
                const touch = e.touches[0];
                handleMove(touch.clientX, touch.clientY);
            } else if (e.touches.length === 2 && initialPinchDistance) {
                const currentDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                const factor = currentDistance / initialPinchDistance;
                const prevScale = scale;
                scale = Math.max(0.4, Math.min(scale * factor, 3.5));
                
                const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                panX = centerX - (centerX - panX) * (scale / prevScale);
                panY = centerY - (centerY - panY) * (scale / prevScale);

                initialPinchDistance = currentDistance;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialPinchDistance = null;
            handleEnd();
        });

        function handleStart(clientX, clientY) {
            isDraggingMoved = false;
            const mouseX = (clientX - panX) / scale;
            const mouseY = (clientY - panY) / scale;

            let hitNode = false;
            for (let node of brainData) {
                const p = nodesPos[node.id];
                if (p && Math.hypot(p.x - mouseX, p.y - mouseY) < 25) {
                    draggingNodeId = node.id;
                    hitNode = true;
                    break;
                }
            }

            if (!hitNode) {
                isPanning = true;
                startPanX = clientX - panX;
                startPanY = clientY - panY;
            }
        }

        function handleMove(clientX, clientY) {
            if (draggingNodeId) {
                isDraggingMoved = true;
                nodesPos[draggingNodeId].x = (clientX - panX) / scale;
                nodesPos[draggingNodeId].y = (clientY - panY) / scale;
            } else if (isPanning) {
                panX = clientX - startPanX;
                panY = clientY - startPanY;
            }
        }

        function handleEnd() {
            if (draggingNodeId && !isDraggingMoved) {
                openViewDrawer(draggingNodeId);
            }
            draggingNodeId = null;
            isPanning = false;
        }

        renderSidebar();
        animate();
    </script>
</body>
